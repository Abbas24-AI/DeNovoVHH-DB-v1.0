# Fly.io config — https://fly.io/docs/reference/configuration/
# Deploy:  fly launch --no-deploy   (creates the app, keep this file)
#          fly deploy
app = "denovovhh-db"
primary_region = "sin"        # Singapore — nearest to Malaysia

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  WEB_CONCURRENCY = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle (set "off" for always-on)
  auto_start_machines = true
  min_machines_running = 0      # set to 1 for always-on (no cold starts)

  [http_service.checks]
    [http_service.checks.health]
      method = "get"
      path = "/"
      interval = "30s"
      timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # pandas/biopython need headroom; 256mb is too tight
